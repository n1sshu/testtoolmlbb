<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="display2.css">
</head>
<body>



<div class="mainbox">

    <!-- ════ BAN ROW ════ -->
    <div class="ban-row">

        <div class="banholder banholder-left">
            <div class="banhero">
                <div id="image-box-11" class="image-box"><img id="image-display-11" src=""></div>
                <div id="ban-left-1" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-12" class="image-box"><img id="image-display-12" src=""></div>
                <div id="ban-left-2" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-13" class="image-box"><img id="image-display-13" src=""></div>
                <div id="ban-left-3" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-14" class="image-box"><img id="image-display-14" src=""></div>
                <div id="ban-left-4" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-15" class="image-box"><img id="image-display-15" src=""></div>
                <div id="ban-left-5" class="box ban0"></div>
            </div>
        </div>

        <!-- ════ BAN CENTER — phase arrows + phase name ════ -->
        <div class="ban-row-center">
            <div class="phase-arrow-ban" id="phase-arrow-ban">
                <div class="arrow-left-ban">
                    <span class="chevron chevron-lg"></span>
                    <span class="chevron chevron-md"></span>
                    <span class="chevron chevron-sm"></span>
                </div>
                <h2 class="phase-arrow-ban-text" id="phase"></h2>
                <div class="arrow-right-ban">
                    <span class="chevron chevron-sm"></span>
                    <span class="chevron chevron-md"></span>
                    <span class="chevron chevron-lg"></span>
                </div>
            </div>
        </div>

        <div class="banholder banholder-right">
            <div class="banhero">
                <div id="image-box-20" class="image-box"><img id="image-display-20" src=""></div>
                <div id="ban-right-5" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-19" class="image-box"><img id="image-display-19" src=""></div>
                <div id="ban-right-4" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-18" class="image-box"><img id="image-display-18" src=""></div>
                <div id="ban-right-3" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-17" class="image-box"><img id="image-display-17" src=""></div>
                <div id="ban-right-2" class="box ban0"></div>
            </div>
            <div class="banhero">
                <div id="image-box-16" class="image-box"><img id="image-display-16" src=""></div>
                <div id="ban-right-1" class="box ban0"></div>
            </div>
        </div>

    </div>

    <!-- ════ TIMER STRIP — between bans and picks ════ -->
    <div class="timer-strip">
        <div class="timer-bar-wrap">
            <div class="timer-bar-fill" id="timer-bar"></div>
        </div>
    </div>

    <!-- ════ PICKS ROW ════ -->
    <div class="lower">

        <!-- ─── BLUE TEAM ─── -->
        <div class="lowerside">
            <div class="pickholder">
                <div class="heropick">
                    <div class="lanelogo bluelane"><img id="player-lane-1-blue" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-1" class="image-box"><img id="image-display-1" src=""></div>
                    <div class="name-image-box" id="name-image-box-3"></div>
                    <div id="pick-left-1" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo bluelane"><img id="player-lane-2-blue" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-2" class="image-box"><img id="image-display-2" src=""></div>
                    <div class="name-image-box" id="name-image-box-4"></div>
                    <div id="pick-left-2" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo bluelane"><img id="player-lane-3-blue" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-3" class="image-box"><img id="image-display-3" src=""></div>
                    <div class="name-image-box" id="name-image-box-5"></div>
                    <div id="pick-left-3" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo bluelane"><img id="player-lane-4-blue" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-4" class="image-box"><img id="image-display-4" src=""></div>
                    <div class="name-image-box" id="name-image-box-6"></div>
                    <div id="pick-left-4" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo bluelane"><img id="player-lane-5-blue" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-5" class="image-box"><img id="image-display-5" src=""></div>
                    <div class="name-image-box" id="name-image-box-7"></div>
                    <div id="pick-left-5" class="box pick"></div>
                </div>
            </div>
            <div class="nickholder">
                <div class="playername"><div id="name-box-3"></div></div>
                <div class="playername"><div id="name-box-4"></div></div>
                <div class="playername"><div id="name-box-5"></div></div>
                <div class="playername"><div id="name-box-6"></div></div>
                <div class="playername"><div id="name-box-7"></div></div>
            </div>
        </div>

        <!-- ─── CENTER PANEL ─── -->
        <div class="center-panel">

            <!-- TOP: tournament logo + match info -->
            <div class="center-top">
                <div style="width:60px"></div>
                <div class="monarchylogo"></div>
                <div class="center-match-info">

                </div>
            </div>
        
            <div class="center-divider"></div>
        
            <!-- MAIN: team logo, abbr, arrow, abbr, logo -->
            <div class="matchup-row">
                <div class="team-block blue">
                    
                    <div class="team-logo-block">
                        <img id="displayImage1" src="" alt="">
                        <div class="team-logo-ring"></div>
                    </div>
                </div>
        
                <!-- CSS triangle arrow, JS controls direction class -->
                <div class="phase-arrow-center" id="phase-arrow-center">

                    <span class="phase-arrow-timer" id="phase-arrow-timer">00</span>

                </div>
        
                <div class="team-block red">
                    <div class="team-logo-block">
                        <img id="displayImage2" src="" alt="">
                        <div class="team-logo-ring"></div>
                    </div>
                </div>
            </div>
        
            <!-- BOTTOM: score lines -->
            <div class="center-bottom">
                <div class="score-lines" id="blue-score-lines">
                    <div class="score-line" id="blue-s3"></div>
                    <div class="score-line" id="blue-s2"></div>
                    <div class="score-line" id="blue-s1"></div>
                </div>
                <span class="score-team-label" id="nickblue">BLUE</span>
                <div style="width:1px;height:20px;background:var(--border)"></div>
                <span class="score-team-label" id="nickred">RED</span>
                <div class="score-lines" id="red-score-lines">
                    <div class="score-line" id="red-s1"></div>
                    <div class="score-line" id="red-s2"></div>
                    <div class="score-line" id="red-s3"></div>
                </div>
            </div>
        
        </div>

        <!-- ─── RED TEAM ─── -->
        <div class="lowerside">
            <div class="pickholder">
                <div class="heropick">
                    <div class="lanelogo redlane"><img id="player-lane-5-red" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-10" class="image-box"><img id="image-display-10" src=""></div>
                    <div class="name-image-box" id="name-image-box-14"></div>
                    <div id="pick-right-5" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo redlane"><img id="player-lane-4-red" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-9" class="image-box"><img id="image-display-9" src=""></div>
                    <div class="name-image-box" id="name-image-box-13"></div>
                    <div id="pick-right-4" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo redlane"><img id="player-lane-3-red" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-8" class="image-box"><img id="image-display-8" src=""></div>
                    <div class="name-image-box" id="name-image-box-12"></div>
                    <div id="pick-right-3" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo redlane"><img id="player-lane-2-red" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-7" class="image-box"><img id="image-display-7" src=""></div>
                    <div class="name-image-box" id="name-image-box-11"></div>
                    <div id="pick-right-2" class="box pick"></div>
                </div>
                <div class="heropick">
                    <div class="lanelogo redlane"><img id="player-lane-1-red" class="lane-icon" src="Assets/lane/none.png" alt=""></div>
                    <div id="image-box-6" class="image-box"><img id="image-display-6" src=""></div>
                    <div class="name-image-box" id="name-image-box-10"></div>
                    <div id="pick-right-1" class="box pick"></div>
                </div>
            </div>
            <div class="nickholder">
                <div class="playername"><div id="name-box-14"></div></div>
                <div class="playername"><div id="name-box-13"></div></div>
                <div class="playername"><div id="name-box-12"></div></div>
                <div class="playername"><div id="name-box-11"></div></div>
                <div class="playername"><div id="name-box-10"></div></div>
            </div>
        </div>

    </div>

</div>

<div class="gold-line"></div>


<audio id="hero-voice"></audio>
<button class="audiob" onclick="new Audio().play().catch(e => console.log('Audio unlocked'))">Enable Audio</button>

<div class="hide">
    <div id="_shim-image-box-15"></div>
    <div id="_shim-ban-left-5"></div>
    <div id="_shim-image-box-20"></div>
    <div id="_shim-ban-right-5"></div>
</div>

<script src="script/displaynicknamelogo.js"></script>
<script src="script/displayhero.js"></script>
<script src="script/laneimg.js"></script>



</body>
</html>
