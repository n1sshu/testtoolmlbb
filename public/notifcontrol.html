<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <style>
        @font-face {
            font-family: 'Big Noodle Titling';
            src: url('Assets/Font/big_noodle_titling.ttf') format('truetype');
        }

        :root {
            --bg: #0D0F12;
            --surface: rgba(26, 28, 32, 0.6);
            --border: rgba(63, 63, 70, 0.55);
            --border-solid: #3f3f46;
            --font: #EAEAEA;
            --muted: #888;
            --accent: #A855F7;
            --accent-glow: rgba(168,85,247,0.45);
            --blue: #00AFFF;
            --red: #F94868;
            --active: #00FF8C;
            --kill-1: #FF4040;
            --kill-2: #FF8C00;
            --kill-3: #FFD700;
            --kill-4: #A855F7;
            --kill-5: #00FF8C;
            --kill-6: #FF2222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Big Noodle Titling', sans-serif;
            background: var(--bg);
            color: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            position: relative;
            overflow-x: hidden;
        }

        .blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0.35; }
        .blob {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, #9333ea, #27272A);
            filter: blur(90px);
            animation: blobf 20s ease-in-out infinite alternate;
        }
        .blob:nth-child(1) { width: 440px; height: 440px; top: 5%; left: 10%; }
        .blob:nth-child(2) { width: 520px; height: 520px; bottom: 5%; right: 5%; animation-delay: 3s; animation-duration: 25s; }
        @keyframes blobf { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,-30px) scale(1.15); } }

        .content { position: relative; z-index: 1; width: 100%; max-width: 1100px; }

        /* ─── HEADER ─── */
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 3.2em; letter-spacing: 6px; font-style: oblique; color: var(--font); }
        .header h1 span { color: var(--accent); }
        .header p { color: var(--muted); font-size: 1.1em; letter-spacing: 2px; margin-top: 4px; }

        /* ─── STATUS BAR ─── */
        .status-bar {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 4px;
            text-align: center;
            padding: 10px;
            margin-bottom: 24px;
            font-size: 1.8em;
            font-style: oblique;
            letter-spacing: 3px;
        }
        .status-bar.ok      { color: var(--active); }
        .status-bar.err     { color: var(--red); }
        .status-bar.sending { color: var(--accent); }

        /* ─── MAIN GRID ─── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 700px) { .main-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 2px;
        }

        .panel-header {
            background: rgba(0,0,0,0.35);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            font-size: 1.5em;
            letter-spacing: 4px;
            font-style: oblique;
            color: var(--muted);
        }

        .panel-body { padding: 16px; }

        /* ─── EVENT BUTTONS ─── */
        .section-label {
            font-size: 1em;
            letter-spacing: 3px;
            color: var(--muted);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .obj-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .evt-btn {
            font-family: 'Big Noodle Titling', sans-serif;
            font-size: 1.25em;
            letter-spacing: 2px;
            font-style: oblique;
            padding: 14px 10px;
            background: rgba(255,255,255,0.07);
            border: 2px solid var(--border-solid);
            color: var(--font);
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.18s ease;
            position: relative;
            text-align: center;
            line-height: 1.2;
        }

        .evt-btn:hover {
            transform: translateY(-2px);
            background: rgba(168,85,247,0.18);
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .evt-btn.selected {
            border-color: var(--accent);
            background: rgba(168,85,247,0.28);
            box-shadow: 0 0 22px var(--accent-glow);
            color: #fff;
        }

        .evt-btn.selected::after {
            content: '✓';
            position: absolute;
            top: 4px; right: 6px;
            font-size: 0.75em;
            color: var(--accent);
        }

        .kill-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .kill-btn { height: 80px; }
        .kill-btn:nth-child(1) { border-color: #661a1a; }
        .kill-btn:nth-child(1):hover, .kill-btn:nth-child(1).selected { border-color: var(--kill-1); background: rgba(255,64,64,0.18); box-shadow: 0 0 18px rgba(255,64,64,0.4); }
        .kill-btn:nth-child(2) { border-color: #664a1a; }
        .kill-btn:nth-child(2):hover, .kill-btn:nth-child(2).selected { border-color: var(--kill-2); background: rgba(255,140,0,0.18); box-shadow: 0 0 18px rgba(255,140,0,0.4); }
        .kill-btn:nth-child(3) { border-color: #666620; }
        .kill-btn:nth-child(3):hover, .kill-btn:nth-child(3).selected { border-color: var(--kill-3); background: rgba(255,215,0,0.18); box-shadow: 0 0 18px rgba(255,215,0,0.4); }
        .kill-btn:nth-child(4) { border-color: #4a2266; }
        .kill-btn:nth-child(4):hover, .kill-btn:nth-child(4).selected { border-color: var(--kill-4); background: rgba(168,85,247,0.18); box-shadow: 0 0 18px rgba(168,85,247,0.4); }
        .kill-btn:nth-child(5) { border-color: #1a6640; }
        .kill-btn:nth-child(5):hover, .kill-btn:nth-child(5).selected { border-color: var(--kill-5); background: rgba(0,255,140,0.18); box-shadow: 0 0 18px rgba(0,255,140,0.4); }
        .kill-btn:nth-child(6) { border-color: #661a1a; }
        .kill-btn:nth-child(6):hover, .kill-btn:nth-child(6).selected { border-color: var(--kill-6); background: rgba(255,34,34,0.2); box-shadow: 0 0 18px rgba(255,34,34,0.5); }

        /* ─── PLAYER PICKER ─── */
        .team-section { margin-bottom: 14px; }

        .team-label {
            font-size: 1.1em;
            letter-spacing: 3px;
            padding: 5px 10px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .team-label.blue-label { color: var(--blue); border-left: 3px solid var(--blue); }
        .team-label.red-label  { color: var(--red);  border-left: 3px solid var(--red); }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .player-btn {
            font-family: 'Big Noodle Titling', sans-serif;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-solid);
            color: var(--font);
            cursor: pointer;
            border-radius: 2px;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.18s ease;
            text-align: center;
        }

        .player-btn img {
            width: 48px;
            height: 56px;
            object-fit: cover;
            object-position: top center;
            border-radius: 2px;
            background: rgba(255,255,255,0.05);
            display: block;
        }

        .player-btn span {
            font-size: 0.95em;
            letter-spacing: 1px;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .player-btn.blue-player:hover, .player-btn.blue-player.selected {
            border-color: var(--blue);
            background: rgba(0,175,255,0.18);
            box-shadow: 0 0 14px rgba(0,175,255,0.35);
        }
        .player-btn.red-player:hover, .player-btn.red-player.selected {
            border-color: var(--red);
            background: rgba(249,72,104,0.18);
            box-shadow: 0 0 14px rgba(249,72,104,0.35);
        }
        .player-btn.selected span { color: #fff; }

        /* No player option */
        .no-player-btn {
            width: 100%;
            font-family: 'Big Noodle Titling', sans-serif;
            font-size: 1em;
            letter-spacing: 2px;
            font-style: oblique;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed var(--border-solid);
            color: var(--muted);
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.18s ease;
            margin-bottom: 12px;
        }
        .no-player-btn:hover {
            border-color: var(--accent);
            color: var(--font);
        }
        .no-player-btn.selected {
            border-color: var(--accent);
            background: rgba(168,85,247,0.15);
            color: #fff;
        }

        .player-picker-empty {
            font-size: 1em;
            letter-spacing: 2px;
            color: var(--muted);
            padding: 18px 0;
            text-align: center;
            line-height: 1.8;
        }

        /* ─── FIRE BUTTON ─── */
        .fire-section { margin-top: 20px; }

        #fireBtn {
            width: 100%;
            font-family: 'Big Noodle Titling', sans-serif;
            font-size: 2em;
            letter-spacing: 6px;
            font-style: oblique;
            padding: 18px;
            border: 2px solid var(--accent);
            background: rgba(168,85,247,0.15);
            color: #fff;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        #fireBtn:hover {
            background: rgba(168,85,247,0.35);
            box-shadow: 0 0 30px var(--accent-glow);
            transform: scale(1.01);
        }

        #fireBtn:active { transform: scale(0.98); }

        #fireBtn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .fire-hint {
            text-align: center;
            color: var(--muted);
            font-size: 1em;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        /* ─── SELECTION PREVIEW ─── */
        .preview-bar {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 10px 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 1.1em;
            letter-spacing: 2px;
            flex-wrap: wrap;
        }
        .preview-chip {
            padding: 4px 12px;
            border-radius: 2px;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.95em;
        }
        .preview-chip.filled {
            border-color: var(--accent);
            color: #fff;
            background: rgba(168,85,247,0.2);
        }

        /* ─── KEYBOARD HINTS ─── */
        .kb-hint {
            position: absolute;
            top: 4px; left: 6px;
            font-size: 0.7em;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0;
            font-style: normal;
        }

        /* ─── OBJECTIVES SPACING ─── */
        .obj-section { margin-bottom: 16px; }
        .obj-section:last-child { margin-bottom: 0; }

        /* logo */
        .logo-footer { text-align: center; margin-top: 28px; }
        .logo-footer img { max-width: 220px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="blobs">
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<div class="content">

    <div class="header">
        <h1>ANIM <span>CONTROL</span></h1>
        <p>SELECT EVENT + PLAYER → FIRE</p>
    </div>

    <div id="statusBar" class="status-bar">STANDBY</div>

    <div class="preview-bar">
        <span style="color:var(--muted);font-size:0.9em;letter-spacing:3px;">READY TO FIRE:</span>
        <span id="previewEvent"  class="preview-chip">NO EVENT</span>
        <span style="color:var(--muted)">+</span>
        <span id="previewPlayer" class="preview-chip">NO PLAYER</span>
    </div>

    <div class="main-grid">

        <!-- LEFT: Objectives + Kills -->
        <div>
            <div class="panel" style="margin-bottom:16px;">
                <div class="panel-header">OBJECTIVES</div>
                <div class="panel-body">

                    <div class="obj-section">
                        <div class="section-label">TURTLE</div>
                        <div class="obj-row">
                            <button class="evt-btn" data-id="videoPlayer1">
                                <span class="kb-hint">W</span>
                                TURTLE SPAWN
                            </button>
                            <button class="evt-btn" data-id="videoPlayer2">
                                <span class="kb-hint">A</span>
                                TURTLE SLAIN
                            </button>
                        </div>
                    </div>

                    <div class="obj-section">
                        <div class="section-label">LORD</div>
                        <div class="obj-row">
                            <button class="evt-btn" data-id="videoPlayer4">
                                <span class="kb-hint">R</span>
                                LORD SPAWN
                            </button>
                            <button class="evt-btn" data-id="videoPlayer5">
                                <span class="kb-hint">D</span>
                                LORD SLAIN
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <div class="panel">
                <div class="panel-header">KILL NOTIFICATIONS</div>
                <div class="panel-body">
                    <div class="kill-grid">
                        <button class="evt-btn kill-btn" data-id="videoPlayer7">
                            <span class="kb-hint">1</span>
                            FIRST<br>BLOOD
                        </button>
                        <button class="evt-btn kill-btn" data-id="videoPlayer8">
                            <span class="kb-hint">2</span>
                            DOUBLE<br>KILL
                        </button>
                        <button class="evt-btn kill-btn" data-id="videoPlayer9">
                            <span class="kb-hint">3</span>
                            TRIPLE<br>KILL
                        </button>
                        <button class="evt-btn kill-btn" data-id="videoPlayer10">
                            <span class="kb-hint">4</span>
                            MANIAC
                        </button>
                        <button class="evt-btn kill-btn" data-id="videoPlayer11">
                            <span class="kb-hint">5</span>
                            SAVAGE
                        </button>
                    
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Player picker + Fire -->
        <div>
            <div class="panel">
                <div class="panel-header">SELECT PLAYER</div>
                <div class="panel-body" id="playerPickerBody">
                    <div class="player-picker-empty">Loading players from match data…</div>
                </div>
            </div>

            <div class="fire-section">
                <button id="fireBtn" disabled onclick="fireNotification()">
                    ▶ FIRE ANIMATION
                </button>
                <div class="fire-hint">SPACE = fire &nbsp;·&nbsp; ESC = clear selection</div>
            </div>
        </div>

    </div>

    <div class="logo-footer">
        <img src="Assets/Other/OVERLAYTOOLLOGO.png" alt="">
    </div>

</div>

<script>
    let selectedEvent  = null;
    let selectedPlayer = null;   /* null = nothing picked, '' = "no player" chosen */

    const statusBar    = document.getElementById('statusBar');
    const previewEvent = document.getElementById('previewEvent');
    const previewPlyr  = document.getElementById('previewPlayer');
    const fireBtn      = document.getElementById('fireBtn');

    /* videoPlayer3 / videoPlayer6 (the old separate RED variants) are
       gone — team is now resolved automatically from the selected player,
       so there's just one TURTLE SLAIN / LORD SLAIN event each. */
    const EVENT_LABELS = {
        'videoPlayer1':  'TURTLE SPAWN',
        'videoPlayer2':  'TURTLE SLAIN',
        'videoPlayer4':  'LORD SPAWN',
        'videoPlayer5':  'LORD SLAIN',
        'videoPlayer7':  'FIRST BLOOD',
        'videoPlayer8':  'DOUBLE KILL',
        'videoPlayer9':  'TRIPLE KILL',
        'videoPlayer10': 'MANIAC',
        'videoPlayer11': 'SAVAGE',
        'videoPlayer12': 'WIPE OUT',
    };

    /* ─── EVENT BUTTON SELECTION ─── */
    document.querySelectorAll('.evt-btn[data-id]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.evt-btn[data-id]').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedEvent = btn.dataset.id;
            updatePreview();
            updateFireBtn();
        });
    });

    function selectEvent(id) {
        document.querySelectorAll('.evt-btn[data-id]').forEach(b => b.classList.remove('selected'));
        const btn = document.querySelector(`.evt-btn[data-id="${id}"]`);
        if (btn) btn.classList.add('selected');
        selectedEvent = id;
        updatePreview();
        updateFireBtn();
    }

    /* ─── PLAYER LOADER — uses /api/matchdata ─── */
    async function loadPlayers() {
        const body = document.getElementById('playerPickerBody');
        try {
            const res = await fetch('/api/matchdata');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            renderPlayerPicker(data);
        } catch(e) {
            body.innerHTML = `
                <div class="player-picker-empty">
                    ⚠ Could not load match data.<br>
                    Make sure the server is running.<br>
                    <small style="opacity:.5">${e.message}</small>
                </div>`;
        }
    }

    function renderPlayerPicker(data) {
        const body = document.getElementById('playerPickerBody');
        body.innerHTML = '';

        const blue = data?.teamdata?.blueteam;
        const red  = data?.teamdata?.redteam;

        /* "No Player" option — for objective-only events */
        const noPlyrBtn = document.createElement('button');
        noPlyrBtn.className   = 'no-player-btn';
        noPlyrBtn.textContent = '— NO PLAYER (Objective Only)';
        noPlyrBtn.addEventListener('click', () => selectPlayer('', noPlyrBtn));
        body.appendChild(noPlyrBtn);

        let hasAny = false;

        if (blue?.playerlist?.length) {
            hasAny = true;
            const sec = document.createElement('div');
            sec.className = 'team-section';
            sec.innerHTML = `<div class="team-label blue-label">${blue.teamname || 'BLUE TEAM'}</div>`;
            const grid = makePlayerGrid(blue.playerlist, 'blue-player');
            sec.appendChild(grid);
            body.appendChild(sec);
        }

        if (red?.playerlist?.length) {
            hasAny = true;
            const sec = document.createElement('div');
            sec.className = 'team-section';
            sec.innerHTML = `<div class="team-label red-label">${red.teamname || 'RED TEAM'}</div>`;
            const grid = makePlayerGrid(red.playerlist, 'red-player');
            sec.appendChild(grid);
            body.appendChild(sec);
        }

        if (!hasAny) {
            const msg = document.createElement('div');
            msg.className = 'player-picker-empty';
            msg.textContent = 'No players found in match data.';
            body.appendChild(msg);
        }
    }

    function makePlayerGrid(playerList, colorClass) {
        const grid = document.createElement('div');
        grid.className = 'player-grid';
        playerList.forEach(p => grid.appendChild(makePlayerBtn(p.name, colorClass)));
        return grid;
    }

    function makePlayerBtn(name, colorClass) {
        const btn = document.createElement('button');
        btn.className    = `player-btn ${colorClass}`;
        btn.dataset.name = name;

        /* Player portrait — fetched from Assets/player/{name}.png */
        const img = document.createElement('img');
        img.alt = name;
        img.src = `Assets/player/${encodeURIComponent(name)}.png`;
        img.onerror = () => {
            /* Fallback to generic placeholder if portrait missing */
            img.onerror = null;
            img.src = 'Assets/player/noplayer.png';
        };

        const lbl = document.createElement('span');
        lbl.textContent = name;

        btn.appendChild(img);
        btn.appendChild(lbl);
        btn.addEventListener('click', () => selectPlayer(name, btn));
        return btn;
    }

    function selectPlayer(name, btn) {
        /* Deselect all player buttons + no-player button */
        document.querySelectorAll('.player-btn, .no-player-btn').forEach(b => b.classList.remove('selected'));
        if (btn) btn.classList.add('selected');
        selectedPlayer = name;
        updatePreview();
        updateFireBtn();
    }

    /* ─── PREVIEW & FIRE BTN STATE ─── */
    function updatePreview() {
        if (selectedEvent) {
            previewEvent.textContent = EVENT_LABELS[selectedEvent] || selectedEvent;
            previewEvent.classList.add('filled');
        } else {
            previewEvent.textContent = 'NO EVENT';
            previewEvent.classList.remove('filled');
        }

        if (selectedPlayer !== null) {
            previewPlyr.textContent = selectedPlayer === '' ? 'NO PLAYER' : selectedPlayer;
            previewPlyr.classList.toggle('filled', selectedPlayer !== '');
        } else {
            previewPlyr.textContent = 'NO PLAYER';
            previewPlyr.classList.remove('filled');
        }
    }

    function updateFireBtn() {
        /* Allow firing as long as an event is selected (player is optional) */
        fireBtn.disabled = !selectedEvent;
    }

    function setStatus(msg, type) {
        statusBar.textContent = msg;
        statusBar.className   = `status-bar ${type || ''}`;
        if (type === 'ok') {
            setTimeout(() => {
                statusBar.textContent = 'STANDBY';
                statusBar.className   = 'status-bar';
            }, 3000);
        }
    }

    /* ─── FIRE ─── */
    async function fireNotification() {
        if (!selectedEvent) return;
        setStatus('SENDING…', 'sending');
        try {
            const res = await fetch('/api/notification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    videoId:    selectedEvent,
                    playerName: selectedPlayer || ''
                })
            });
            if (res.ok) {
                const label = EVENT_LABELS[selectedEvent] || selectedEvent;
                const player = selectedPlayer ? ` — ${selectedPlayer}` : '';
                setStatus(`FIRED: ${label}${player}`, 'ok');
            } else {
                setStatus('ERROR — SERVER RETURNED ' + res.status, 'err');
            }
        } catch(e) {
            setStatus('SERVER ERROR — ' + e.message, 'err');
        }
    }

    /* ─── KEYBOARD SHORTCUTS ───
       's' and 'f' (old RED TURTLE/LORD SLAIN) are retired since team is
       now auto-detected from the selected player. */
    const KEY_MAP = {
        'w': 'videoPlayer1',  'a': 'videoPlayer2',
        'r': 'videoPlayer4',  'd': 'videoPlayer5',
        '1': 'videoPlayer7',  '2': 'videoPlayer8',  '3': 'videoPlayer9',
        '4': 'videoPlayer10', '5': 'videoPlayer11', '6': 'videoPlayer12',
    };

    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (KEY_MAP[e.key]) {
            e.preventDefault();
            selectEvent(KEY_MAP[e.key]);
        }
        if (e.code === 'Space' && selectedEvent) {
            e.preventDefault();
            fireNotification();
        }
        if (e.code === 'Escape') {
            selectedEvent  = null;
            selectedPlayer = null;
            document.querySelectorAll('.evt-btn[data-id], .player-btn, .no-player-btn')
                    .forEach(b => b.classList.remove('selected'));
            updatePreview();
            updateFireBtn();
        }
    });

    /* ─── INIT ─── */
    loadPlayers();
    /* Refresh player list every 30s in case match data updates */
    setInterval(loadPlayers, 10000);
</script>
</body>
</html>
