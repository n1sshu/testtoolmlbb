<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postgame Control (Match Data) - with Screenshot Scanner</title>
    <!-- OCR engine for KDA / gold / level / score (needs internet the first time) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @font-face { font-family: 'Big Noodle Titling'; src: url('Assets/Font/big_noodle_titling.ttf') format('truetype'); }

        :root {
            --bg-dark: #09090b;
            --font-color: #EAEAEA;
            --accent-color: #A855F7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --glass-blur: blur(16px);
            --blue-side: #00AFFF;
            --red-side: #F94868;
            --active-green: #00FF8C;
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 4px !important; outline: none; }

        body {
            font-family: 'Big Noodle Titling', sans-serif;
            margin: 0; padding: 20px; padding-bottom: 100px;
            background-color: var(--bg-dark); color: var(--font-color);
            letter-spacing: 1px; overflow-x: hidden; position: relative;
        }

        .blob-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; pointer-events: none; }
        .blob { position: absolute; opacity: 0.5; filter: blur(90px); border-radius: 50%; }
        .blob-1 { width: 500px; height: 500px; background: #7e22ce; top: -10%; left: -10%; animation: float 20s infinite ease-in-out; }
        .blob-2 { width: 600px; height: 600px; background: #1e1b4b; bottom: -10%; right: -10%; animation: float 25s infinite ease-in-out reverse; }
        .blob-3 { width: 300px; height: 300px; background: #be123c; top: 40%; right: 20%; opacity: 0.3; animation: float 18s infinite ease-in-out; }
        @keyframes float { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(30px,40px) rotate(10deg); } 100% { transform: translate(0,0) rotate(0deg); } }

        .container { max-width: 1650px; margin: 0 auto; position: relative; z-index: 1; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); padding: 20px; margin-bottom: 30px;
        }

        h1 { text-align: center; margin-bottom: 30px; text-shadow: 0 0 25px var(--accent-glow); font-size: 3.5rem; text-transform: uppercase; font-weight: normal; letter-spacing: 3px; }
        h2 { font-size: 2rem; margin: 0; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }

        .game-info-panel { display: flex; justify-content: center; gap: 60px; }
        .info-group { display: flex; flex-direction: column; align-items: center; min-width: 180px; }
        .info-group label { color: #aaa; font-size: 1.1rem; margin-bottom: 5px; letter-spacing: 2px; }
        .info-group input { width: 100%; font-size: 2.5rem; color: var(--accent-color); font-weight: normal; background: transparent; border: none; border-bottom: 2px solid rgba(255,255,255,0.1); padding: 5px; text-align: center; transition: all 0.3s ease; }
        .info-group input:focus { border-color: var(--accent-color); text-shadow: 0 0 15px var(--accent-glow); }

        .winner-panel { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; background: rgba(0,0,0,0.2); border-radius: 50px !important; padding: 10px; border: 1px solid rgba(255,255,255,0.05); width: fit-content; margin-left: auto; margin-right: auto; }
        .win-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #888; width: 200px; padding: 10px; font-size: 1.4rem; cursor: pointer; transition: all 0.3s ease; border-radius: 40px !important; font-family: inherit; }
        .win-btn.blue:hover, .win-btn.blue.active { background: rgba(0,175,255,0.2); border-color: var(--blue-side); color: var(--blue-side); box-shadow: 0 0 20px rgba(0,175,255,0.3); }
        .win-btn.red:hover, .win-btn.red.active { background: rgba(249,72,104,0.2); border-color: var(--red-side); color: var(--red-side); box-shadow: 0 0 20px rgba(249,72,104,0.3); }

        .section-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .team-blue { border-left: 4px solid var(--blue-side); }
        .team-red { border-left: 4px solid var(--red-side); }
        .team-blue h2 { color: var(--blue-side); text-shadow: 0 0 20px rgba(0,175,255,0.3); }
        .team-red h2 { color: var(--red-side); text-shadow: 0 0 20px rgba(249,72,104,0.3); }

        .stats-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: var(--input-bg); padding: 15px; border: 1px solid var(--input-border); display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .stat-box:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .stat-box label { color: #999; font-size: 1rem; margin-bottom: 5px; }
        .stat-box input { width: 100%; font-size: 1.6rem; border: none; background: transparent; text-align: center; color: white; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; min-width: 1000px; }
        th { text-align: left; padding: 15px; color: #888; font-size: 1.1rem; letter-spacing: 1.5px; font-weight: normal; }
        td { padding: 8px 12px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; height: 65px; }
        tr:hover td { background: rgba(255,255,255,0.05); }

        input[type="text"], input[type="number"] { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); color: white; padding: 8px; font-family: inherit; font-size: 1.2rem; text-align: center; transition: all 0.2s; }
        input:focus { border-color: var(--accent-color); background: black; }
        input[readonly] { background: transparent; border: none; font-size: 2rem; padding: 0; }

        .hero-display { display: flex; align-items: center; gap: 15px; }
        .hero-img { width: 48px; height: 48px; object-fit: cover; border: 1px solid #444; background: #000; flex-shrink: 0; }
        .player-name { font-size: 1.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; display: block; }

        .item-container-row { display: flex; align-items: center; gap: 4px; height: 100%; }
        .item-slot { width: 44px; height: 44px; background: rgba(0,0,0,0.4); border: 1px solid #444; cursor: pointer; display: flex; justify-content: center; align-items: center; position: relative; flex-shrink: 0; transition: all 0.2s; }
        .item-slot:hover { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); transform: scale(1.05); z-index: 10; }
        .item-slot img { width: 100%; height: 100%; object-fit: contain; }
        .empty-slot { border: 1px dashed #444; opacity: 0.4; }
        .empty-slot:hover { border-style: solid; opacity: 1; }

        .mvp-cell { text-align: center; }
        .mvp-checkbox { width: 24px; height: 24px; appearance: none; background: #111; border: 2px solid #555; cursor: pointer; display: inline-block; vertical-align: middle; }
        .mvp-checkbox:checked { background: gold; border-color: #ffd700; box-shadow: 0 0 15px gold; }

        #save-status { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 8px 20px; border: 1px solid #333; color: #888; font-weight: bold; z-index: 1000; border-radius: 30px !important; }
        .status-saving { color: yellow !important; border-color: yellow !important; }
        .status-saved { color: var(--active-green) !important; border-color: var(--active-green) !important; }

        .btn-container { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: center; background: rgba(10,10,12,0.8); border-top: 1px solid #333; padding: 15px; z-index: 100; backdrop-filter: blur(10px); }
        button.action-btn { padding: 12px 40px; font-family: inherit; font-size: 1.4rem; cursor: pointer; border: none; font-weight: bold; text-transform: uppercase; background: var(--red-side); color: white; letter-spacing: 2px; box-shadow: 0 0 20px rgba(249,72,104,0.4); transition: all 0.2s; }
        button.action-btn:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(249,72,104,0.8); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.show { display: flex; }
        .modal-content { background: rgba(20,20,25,0.95); width: 90%; max-width: 900px; height: 80vh; border: 1px solid var(--accent-color); display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(168,85,247,0.2); }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 20px; overflow-y: auto; }
        .grid-item { background: rgba(255,255,255,0.05); padding: 10px; text-align: center; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
        .grid-item:hover { border-color: var(--accent-color); background: rgba(0,0,0,0.5); transform: scale(1.05); }
        .grid-item img { width: 50px; height: 50px; object-fit: contain; }
        .grid-item span { display: block; font-size: 0.9rem; margin-top: 5px; color: #ccc; }

        /* ================= SCANNER PANEL ================= */
        .scan-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; font-size: 1.1rem; color: #bbb; }
        .scan-toolbar select, .scan-match select { background: var(--input-bg); color: white; border: 1px solid var(--input-border); font-family: inherit; font-size: 1.1rem; padding: 6px; }
        .scan-btn { display: inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #fff; padding: 9px 16px; cursor: pointer; font-family: inherit; font-size: 1.15rem; letter-spacing: 1px; transition: 0.2s; }
        .scan-btn:hover { background: rgba(255,255,255,0.14); }
        .scan-btn.primary { background: rgba(168,85,247,0.3); border-color: var(--accent-color); }
        .scan-btn.apply { background: rgba(0,255,140,0.18); border-color: var(--active-green); color: var(--active-green); margin-left: auto; }
        .scan-btn:disabled { opacity: .35; cursor: not-allowed; }
        .scan-status { font-size: 1.1rem; color: #aaa; text-transform: none; letter-spacing: 1px; }
        .scan-canvas-box { display: none; background: #020812; max-height: 300px; overflow: auto; margin-bottom: 14px; border: 1px solid var(--glass-border); }
        .scan-canvas-box.show { display: block; }
        #scan-canvas { display: block; max-width: 100%; height: auto; }
        .scan-match { display: none; gap: 24px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 12px; background: rgba(0,0,0,.25); border: 1px solid var(--glass-border); }
        .scan-match.show { display: flex; }
        .scan-match label { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 1.1rem; }
        .scan-match input { width: 90px; font-size: 1.4rem; padding: 4px; }
        .scan-results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .scan-col h3 { font-weight: normal; font-size: 1.5rem; margin-bottom: 8px; }
        .scan-col.left h3 { color: var(--blue-side); } .scan-col.right h3 { color: var(--red-side); }
        .scan-card { background: rgba(0,0,0,.28); border: 1px solid var(--glass-border); padding: 10px; margin-bottom: 10px; }
        .scan-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .scan-head .portrait canvas { width: 48px; height: 48px; display: block; border: 1px solid #444; }
        .scan-head .nm { flex: 1; min-width: 0; }
        .scan-head .nm canvas { height: 26px; max-width: 100%; display: block; background: #0a1a33; }
        .scan-head select { width: 210px; }
        .scan-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
        .scan-stats label { font-size: .85rem; color: #888; display: flex; flex-direction: column; }
        .scan-stats input { font-size: 1.2rem; padding: 3px; }
        .scan-items { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .scan-item { background: rgba(0,0,0,.35); border: 1px solid #333; padding: 3px; text-align: center; min-width: 0; }
        .scan-item img { width: 40px; height: 40px; object-fit: contain; display: block; margin: 0 auto 2px; }
        .scan-item input { font-size: .8rem !important; padding: 2px !important; letter-spacing: 0; }
        .scan-item small { font-size: .8rem; color: #72caff; }
        .scan-item.low { border-color: #ffbe67; } .scan-item.low small { color: #ffbe67; }
        .scan-item.empty { opacity: .55; }
        @media (max-width: 1100px) { .scan-results { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="save-status">Ready</div>

    <datalist id="scan-items"></datalist>

    <div id="itemModal" class="modal-overlay">
        <div class="modal-content">
            <div style="padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between;">
                <h2 style="color:var(--accent-color);">SELECT ASSET</h2>
                <span onclick="closeModal()" style="font-size: 2rem; cursor: pointer;">&times;</span>
            </div>
            <div style="padding: 10px; background: rgba(0,0,0,0.3);">
                <input type="text" id="itemSearch" placeholder="SEARCH..." onkeyup="filterItems(this.value)" style="text-align: left;">
            </div>
            <div id="itemGrid" class="item-grid"></div>
        </div>
    </div>

    <div class="container">
        <h1>MATCH DATA EDITOR</h1>

        <!-- ================= SCREENSHOT SCANNER ================= -->
        <div class="glass-panel" id="scan-panel">
            <div class="section-header">
                <h2><span>SCREENSHOT SCANNER</span><span id="scan-status" class="scan-status">Upload a scoreboard screenshot, then press SCAN.</span></h2>
            </div>
            <div class="scan-toolbar">
                <label class="scan-btn">📷 SCREENSHOT<input type="file" id="scan-file" accept="image/*" hidden></label>
                <button class="scan-btn primary" id="scan-go" disabled>🔎 SCAN</button>
                <button class="scan-btn" id="scan-overlay" disabled>◎ OVERLAY</button>
                <label class="scan-btn">📁 ITEM FOLDER (optional)<input type="file" id="scan-folder" accept="image/*" webkitdirectory multiple hidden></label>
                <span>LEFT TEAM IS
                    <select id="scan-leftside"><option value="blue">BLUE</option><option value="red">RED</option></select>
                </span>
                <span>MATCH THRESHOLD <input type="range" id="scan-th" min="50" max="95" value="78" style="width:110px; vertical-align:middle"> <output id="scan-th-out">78%</output></span>
                <button class="scan-btn apply" id="scan-apply" disabled>✔ APPLY TO EDITOR</button>
            </div>
            <div class="scan-canvas-box" id="scan-canvasbox"><canvas id="scan-canvas"></canvas></div>

            <div class="scan-match" id="scan-match">
                <label>LEFT SCORE <input type="number" id="sm-ls"></label>
                <label>RIGHT SCORE <input type="number" id="sm-rs"></label>
                <label>DURATION <input type="text" id="sm-dur" placeholder="00:00" maxlength="5"></label>
                <label>WINNER
                    <select id="sm-win"><option value="none">NONE</option><option value="blue">BLUE</option><option value="red">RED</option></select>
                </label>
            </div>

            <div class="scan-results" id="scan-results"></div>
        </div>

        <div class="game-info-panel glass-panel">
            <div class="info-group">
                <label>GAME NUMBER</label>
                <input type="number" id="game-number" onchange="updateGameInfo('game_number', this.value)">
            </div>
            <div class="info-group">
                <label>DURATION</label>
                <input type="text" id="game-duration" placeholder="00:00" maxlength="5">
            </div>
        </div>

        <div class="winner-panel glass-panel">
            <button class="win-btn blue" id="btn-win-blue" onclick="setWinner('blue')">BLUE WIN</button>
            <button class="win-btn red" id="btn-win-red" onclick="setWinner('red')">RED WIN</button>
        </div>

        <div class="section team-blue glass-panel">
            <div class="section-header">
                <h2>
                    <span id="blue-team-name">BLUE TEAM</span>
                    <span>SCORE: <input type="number" id="blue-score" style="width:70px; display:inline-block;" readonly></span>
                </h2>
            </div>
            <div class="section-body">
                <div class="stats-group">
                    <div class="stat-box"><label>TOTAL GOLD</label><input type="number" id="blue-totalgold" readonly></div>
                </div>
                <div class="table-wrapper">
                    <table id="blue-table">
                        <thead>
                            <tr>
                                <th style="width: 250px;">HERO & PLAYER</th>
                                <th style="width: 200px;">LVL</th>
                                <th style="width: 200px;">KDA</th>
                                <th style="width: 200px;">GOLD</th>
                                <th style="width: 70px;">SPELL</th>
                                <th>ITEMS</th>
                                <th style="width: 60px; text-align: center;">MVP</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="section team-red glass-panel">
            <div class="section-header">
                <h2>
                    <span id="red-team-name">RED TEAM</span>
                    <span>SCORE: <input type="number" id="red-score" style="width:70px; display:inline-block;" readonly></span>
                </h2>
            </div>
            <div class="section-body">
                <div class="stats-group">
                    <div class="stat-box"><label>TOTAL GOLD</label><input type="number" id="red-totalgold" readonly></div>
                </div>
                <div class="table-wrapper">
                    <table id="red-table">
                        <thead>
                            <tr>
                                <th style="width: 250px;">HERO & PLAYER</th>
                                <th style="width: 200px;">LVL</th>
                                <th style="width: 200px;">KDA</th>
                                <th style="width: 200px;">GOLD</th>
                                <th style="width: 70px;">SPELL</th>
                                <th>ITEMS</th>
                                <th style="width: 60px; text-align: center;">MVP</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <button id="reset-btn" class="reset-btn action-btn" onclick="handleResetRequest()">RESET ITEMS & STATS</button>
        </div>
    </div>

    <script>
        /* =====================================================================
           ORIGINAL EDITOR (unchanged logic)
           ===================================================================== */
        let matchData = {};
        let itemList = [];
        let currentEditContext = null;
        let currentMvpId = null;
        let resetStage = 0;
        let resetTimeout;

        const ws = new WebSocket(`ws://${window.location.host}`);

        Promise.all([
            fetch('/api/matchdata').then(r => r.json()),
            fetch('/api/items').then(r => r.json()),
            fetch('/api/mvp').then(r => r.json())
        ]).then(([mData, items, mvpData]) => {
            matchData = mData;
            itemList = items.length ? items : ["winter_truncheon", "immortality"];
            if(mvpData && mvpData.mvp) currentMvpId = mvpData.mvp.checkboxId;
            renderAll();
            fillItemDatalist();
            loadDraftPlayers();
        });

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.type === 'matchdata_update') {
                matchData = msg.data;
                renderAll();
            }
        };

        const durationInput = document.getElementById('game-duration');
        durationInput.addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if(val.length > 4) val = val.slice(0, 4);
            if(val.length > 2) val = val.slice(0, 2) + ':' + val.slice(2);
            e.target.value = val;
            if(val.length === 5) updateGameInfo('game_duration', val);
        });

        function renderAll() {
            if(!matchData.teamdata) return;
            document.getElementById('game-number').value = matchData.game_number || 0;
            if(document.activeElement !== durationInput) {
                 document.getElementById('game-duration').value = matchData.game_duration || "00:00";
            }
            updateWinnerUI();
            renderTeam('blueteam', 'blue-table');
            renderTeam('redteam', 'red-table');
            renderTeamStats();
        }

        function updateWinnerUI() {
            const winner = matchData.winmatches || 'none';
            const btnBlue = document.getElementById('btn-win-blue');
            const btnRed = document.getElementById('btn-win-red');
            btnBlue.classList.remove('active');
            btnRed.classList.remove('active');
            if(winner === 'blue') btnBlue.classList.add('active');
            if(winner === 'red') btnRed.classList.add('active');
        }

        function renderTeamStats() {
            const bd = matchData.teamdata.blueteam;
            const rd = matchData.teamdata.redteam;
            document.getElementById('blue-team-name').textContent = bd.teamname || "BLUE TEAM";
            document.getElementById('blue-score').value = bd.score;
            document.getElementById('blue-totalgold').value = bd.totalgold;
            document.getElementById('red-team-name').textContent = rd.teamname || "RED TEAM";
            document.getElementById('red-score').value = rd.score;
            document.getElementById('red-totalgold').value = rd.totalgold;
        }

        function renderTeam(teamKey, tableId) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = '';
            const players = matchData.teamdata[teamKey].playerlist;

            players.forEach((p, index) => {
                const tr = document.createElement('tr');
                let heroSrc = 'Assets/HeroPick/idle.png';
                if(p.hero && p.hero !== "") heroSrc = `Assets/HeroPick/${p.hero}.png`;

                tr.innerHTML = `
                    <td>
                        <div class="hero-display">
                            <img src="${heroSrc}" class="hero-img" onerror="this.src='Assets/HeroPick/idle.png'">
                            <span class="player-name">${p.name || 'Player '+(index+1)}</span>
                        </div>
                    </td>
                    <td><input type="number" value="${p.level}" onchange="updatePlayer('${teamKey}', ${index}, 'level', this.value)"></td>
                    <td><input type="text" value="${p.KDA}" onchange="updatePlayer('${teamKey}', ${index}, 'KDA', this.value)"></td>
                    <td><input type="number" value="${p.gold}" onchange="updatePlayer('${teamKey}', ${index}, 'gold', this.value)"></td>

                    <td>
                        <div style="display:flex; justify-content:center;">
                            <div class="item-slot" onclick="openModal('${teamKey}', ${index}, 'spell')">
                                <img src="Assets/Itemandspell/${p.spell || 'Execute'}.png" onerror="this.style.display='none'">
                            </div>
                        </div>
                    </td>

            fetch('/api/matchdata', {

            }).then(r => r.json()).then(d => {
                statusEl.textContent = "SAVED";

                setTimeout(() => {
                    statusEl.textContent = "READY";
                    statusEl.classList.remove('status-saved');

            });

        function updateGameInfo(field, value) { matchData[field] = value; autoSave(); }

            matchData.teamdata[team].playerlist[index][field] = value;
            if(field === 'gold') calculateTotalGold(team);
            autoSave();
        }

        function updateTeamStat(team, field, value) { matchData.teamdata[team][field] = value; autoSave(); }

            let total = 0;
            matchData.teamdata[teamKey].playerlist.forEach(p => total += parseInt(p.gold) || 0);
            matchData.teamdata[teamKey].totalgold = total;
            if(teamKey === 'blueteam') document.getElementById('blue-totalgold').value = total;
            else document.getElementById('red-totalgold').value = total;

            right: { itemX: [1637, 1713, 1790, 1867, 1944, 2020], kdaX: [1625, 1676, 1727], gold: [1490, 1600], name: [1815, 2062], level: [2148, 2198], portrait: [2076, 2194] }

        /* ---------- DRAFT APP PLAYER SYNC ---------- */
        function normalizePlayerName(v) {
            return String(v || '')
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '');
        }

        function playerNameFromAny(p) {
            if (typeof p === 'string') return p.trim();
            if (!p || typeof p !== 'object') return '';
            return String(p.name ?? p.nickname ?? p.playerName ?? p.username ?? p.nick ?? '').trim();
        }

        function extractDraftTeams(data) {
            const out = { blueteam: [], redteam: [] };
            const root = data?.data ?? data?.matchdraft ?? data?.draft ?? data ?? {};

            const pickList = (obj) => {
                if (!obj) return [];
                if (Array.isArray(obj)) return obj.map(playerNameFromAny).filter(Boolean);
                if (Array.isArray(obj.playerlist)) return obj.playerlist.map(playerNameFromAny).filter(Boolean);
                if (Array.isArray(obj.players)) return obj.players.map(playerNameFromAny).filter(Boolean);
                if (Array.isArray(obj.playerList)) return obj.playerList.map(playerNameFromAny).filter(Boolean);
                return [];
            };

            const blue = root.blueteam ?? root.blueTeam ?? root.blue ?? root.teamBlue;
            const red  = root.redteam ?? root.redTeam ?? root.red ?? root.teamRed;
            out.blueteam = pickList(blue);
            out.redteam = pickList(red);

            const teams = Array.isArray(root.teams) ? root.teams : [];
            for (const t of teams) {
                const side = String(t.side ?? t.team ?? t.color ?? '').toLowerCase();
                const names = pickList(t);
                if (side.includes('blue')) out.blueteam = names;
                if (side.includes('red')) out.redteam = names;
            }
            return out;
        }

        async function loadDraftPlayers() {
            try {
                const r = await fetch(DRAFT_PLAYERS_API, { cache: 'no-store' });
                if (!r.ok) throw new Error('Draft API returned ' + r.status);
                const data = await r.json();
                const extracted = extractDraftTeams(data);

                if (extracted.blueteam.length || extracted.redteam.length) {
                    draftPlayers = extracted;
                } else {
                    draftPlayers = {
                        blueteam: (matchData.teamdata?.blueteam?.playerlist || []).map(p => p.name).filter(Boolean),
                        redteam: (matchData.teamdata?.redteam?.playerlist || []).map(p => p.name).filter(Boolean)
                    };
                }
                setScanStatus(`Draft players loaded: ${draftPlayers.blueteam.length} BLUE / ${draftPlayers.redteam.length} RED.`);
            } catch (err) {
                draftPlayers = {
                    blueteam: (matchData.teamdata?.blueteam?.playerlist || []).map(p => p.name).filter(Boolean),
                    redteam: (matchData.teamdata?.redteam?.playerlist || []).map(p => p.name).filter(Boolean)
                };
                console.warn('Could not load draft players; using editor player names:', err);
            }
        }

        function similarity(a, b) {
            a = normalizePlayerName(a); b = normalizePlayerName(b);
            if (!a || !b) return 0;
            if (a === b) return 1;
            const m = a.length, n = b.length;
            const prev = new Array(n + 1), cur = new Array(n + 1);
            for (let j = 0; j <= n; j++) prev[j] = j;
            for (let i = 1; i <= m; i++) {
                cur[0] = i;
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(
                        cur[j - 1] + 1,
                        prev[j] + 1,
                        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
                    );
                }
                for (let j = 0; j <= n; j++) prev[j] = cur[j];
            }
            return 1 - prev[n] / Math.max(m, n);
        }

        function matchDraftPlayerName(scannedName, side) {
            const names = draftPlayers[side] || [];
            if (!scannedName || !names.length) return { index: -1, score: 0, name: '' };

            let best = { index: -1, score: 0, name: '' };
            names.forEach((name, i) => {
                const score = similarity(scannedName, name);
                if (score > best.score) best = { index: i, score, name };
            });
            return best;
        }

        function autoAssignRowsByName(rows) {
            const used = new Set();

            for (const r of rows) {
                const targetTeam = (r.side === 'left') === leftIsBlue() ? 'blueteam' : 'redteam';
                const hit = matchDraftPlayerName(r.ocrName, targetTeam);

                if (hit.index >= 0 && hit.score >= 0.72 && !used.has(`${targetTeam}:${hit.index}`)) {
                    r.target = `${targetTeam}:${hit.index}`;
                    r.nameMatch = hit.name;
                    r.nameMatchScore = hit.score;
                    used.add(r.target);
                } else {
                    r.nameMatch = '';
                    r.nameMatchScore = 0;
                }
            }
        }

        /* ---------- geometry helpers ---------- */
        function rowRegions(side, r) {
            const S = SIDES[side], ty = ROWS.textY[r], ly = ROWS.levelY[r], iy = ROWS.itemY[r];
            return {
                k: [S.kdaX[0] - 28, S.kdaX[0] + 28, ty - 24, ty + 24],
                d: [S.kdaX[1] - 28, S.kdaX[1] + 28, ty - 24, ty + 24],
                a: [S.kdaX[2] - 28, S.kdaX[2] + 28, ty - 24, ty + 24],
                gold: [S.gold[0], S.gold[1], ty - 24, ty + 24],
                level: [S.level[0], S.level[1], ly - 20, ly + 20],
                name: [S.name[0], S.name[1], ty - 24, ty + 24],
                portrait: [S.portrait[0], S.portrait[1], iy - 82, iy + 32]
            };
        }
        function grab(reg) {
            const [x0, x1, y0, y1] = reg, a = sxs(), b = sys();
            const w = Math.max(1, Math.round((x1 - x0) * a)), h = Math.max(1, Math.round((y1 - y0) * b));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(SC.src, x0 * a, y0 * b, (x1 - x0) * a, (y1 - y0) * b, 0, 0, w, h);
            return c;
        }
        function drawScan() {
            if (!SC.src) return;
            const c = $s('scan-canvas'); c.width = SC.src.width; c.height = SC.src.height;
            const g = c.getContext('2d'); g.drawImage(SC.src, 0, 0);
            if (!SC.overlay) return;
            const a = sxs(), b = sys();
            g.lineWidth = Math.max(2, 3 * a);
            for (const side of ['left', 'right']) {
                for (let r = 0; r < 5; r++) {
                    g.strokeStyle = '#32ff86';
                    for (const x of SIDES[side].itemX) { g.beginPath(); g.ellipse(x * a, ROWS.itemY[r] * b, 32 * a, 32 * b, 0, 0, 7); g.stroke(); }
                    g.strokeStyle = '#ffd23f';

                    for (const k of ['k', 'd', 'a', 'gold', 'level', 'name']) { const [x0, x1, y0, y1] = R[k]; g.strokeRect(x0 * a, y0 * b, (x1 - x0) * a, (y1 - y0) * b); }
                }
            }
            g.strokeStyle = '#ff5bd7';
            for (const k of ['ls', 'rs', 'dur']) { const [x0, x1, y0, y1] = INFO[k]; g.strokeRect(x0 * a, y0 * b, (x1 - x0) * a, (y1 - y0) * b); }

        /* ---------- OCR ---------- */
        function otsu(hist, total) {
            let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];

            for (let t = 0; t < 256; t++) {

            for (let i = 0; i < w * h; i++) { const v = (p[i * 4] * .299 + p[i * 4 + 1] * .587 + p[i * 4 + 2] * .114) | 0; gray[i] = v; hist[v]++; }
            const th = fixed ?? otsu(hist, w * h);
            for (let i = 0; i < w * h; i++) { const v = gray[i] > th ? 0 : 255; p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = v; p[i * 4 + 3] = 255; }
            tg.putImageData(d, 0, 0);
            const o = document.createElement('canvas'); o.width = w + pad * 2; o.height = h + pad * 2;
            const og = o.getContext('2d'); og.fillStyle = '#fff'; og.fillRect(0, 0, o.width, o.height); og.drawImage(t, pad, pad);

        async function getWorker() {

            setScanStatus('Loading OCR engine…');

        }
        async function readDigits(canvas, whitelist = '0123456789', fixed = null) {

        /* ---------- item matching ---------- */
        function makeVec(c) {
            const p = c.getContext('2d').getImageData(0, 0, TS, TS).data, n = MASK.length;
            const v = new Float32Array(n * 3), m = [0, 0, 0];
            let gs = 0, gs2 = 0;
            for (let ch = 0; ch < 3; ch++) {

                for (let i = 0; i < n; i++) { const x = p[MASK[i] * 4 + ch]; v[ch * n + i] = x; s += x; s2 += x * x; }
                const mean = s / n, sd = Math.max(Math.sqrt(Math.max(s2 / n - mean * mean, 0)), 3);
                m[ch] = mean / 255;
                for (let i = 0; i < n; i++) v[ch * n + i] = (v[ch * n + i] - mean) / sd;
            }
            for (let i = 0; i < n; i++) { const o = MASK[i] * 4, l = p[o] * .299 + p[o + 1] * .587 + p[o + 2] * .114; gs += l; gs2 += l * l; }

        function matchSlot(cx, cy) {
            const a = sxs(), b = sys(), w = ICON_SIZE * a, h = ICON_SIZE * b;
            const vecs = [];
            for (const dy of [-2, 0, 2]) for (const dx of [-2, 0, 2]) {
                tmpG.fillStyle = '#000'; tmpG.fillRect(0, 0, TS, TS);
                tmpG.imageSmoothingQuality = 'high';
                tmpG.drawImage(SC.src, (cx + dx) * a - w / 2, (cy + dy) * b - h / 2, w, h, 0, 0, TS, TS);
                vecs.push(makeVec(tmpC));
            }
            if (vecs[4].gsd < EMPTY_SD) return { name: 'idle', score: 1, empty: true };
            let best = { name: 'idle', score: 0, empty: false };
            for (const t of SC.templates) for (const v of vecs) {
                const s = sim(v, t.vec);
                if (s > best.score) best = { name: t.name, score: s, empty: false };
            }
            return best;
        }
        async function ensureTemplates() {
            if (SC.templates.length) return;
            const names = itemList.filter(n => n && n !== 'idle');
            setScanStatus(`Loading ${names.length} item images from Assets/Itemandspell…`);
            const res = await Promise.all(names.map(n => loadImg(`Assets/Itemandspell/${n}.png`).then(img => ({ name: n, img })).catch(() => null)));
            SC.templates = res.filter(Boolean).map(t => ({ name: t.name, img: t.img, vec: tmplVec(t.img) }));
            if (!SC.templates.length) throw new Error('No item images could be loaded from Assets/Itemandspell. Use the ITEM FOLDER button instead.');
        }

        /* ---------- scan ---------- */
        const defaultTarget = (side, row) => ((side === 'left') === leftIsBlue() ? 'blueteam' : 'redteam') + ':' + row;
        const tick = () => new Promise(r => setTimeout(r, 0));

        async function runScan() {
            if (!SC.src) return;
            $s('scan-go').disabled = true; $s('scan-apply').disabled = true;
            try {
                await ensureTemplates();
                await getWorker();
                const rows = [];
                let n = 0;
                for (const side of ['left', 'right']) {
                    for (let r = 0; r < 5; r++) {
                        n++;
                        setScanStatus(`Reading player ${n}/10…`);
                        const R = rowRegions(side, r), S = SIDES[side];
                        const ocrName = (await readDigits(grab(R.name), 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_- ')).trim();
                        const k = digitsOnly(await readDigits(grab(R.k)));
                        const d = digitsOnly(await readDigits(grab(R.d)));
                        const a = digitsOnly(await readDigits(grab(R.a)));
                        const gold = digitsOnly(await readDigits(grab(R.gold)));
                        let level = digitsOnly(await readDigits(grab(R.level), '0123456789', 215));
                        if (level !== '' && +level > 15) level = '';
                        await tick();
                        const items = [];
                        for (const x of S.itemX) { items.push(matchSlot(x, ROWS.itemY[r])); }
                        rows.push({ side, row: r, k, d, a, gold, level, items, ocrName, target: defaultTarget(side, r), portrait: grab(R.portrait), nameImg: grab(R.name), nameMatch: '', nameMatchScore: 0 });
                        await tick();
                    }
                }
                SC.rows = rows;
                autoAssignRowsByName(SC.rows);

                setScanStatus('Reading scores & duration…');
                SC.info.ls = digitsOnly(await readDigits(grab(INFO.ls)));
                SC.info.rs = digitsOnly(await readDigits(grab(INFO.rs)));
                let dur = digitsOnly(await readDigits(grab(INFO.dur), '0123456789:'));
                if (dur.length >= 4) dur = dur.slice(-4); else if (dur.length === 3) dur = '0' + dur;
                SC.info.dur = dur.length === 4 ? dur.slice(0, 2) + ':' + dur.slice(2) : '';
                autoWinner();
                renderScan();
                setScanStatus('Scan done. Check the values (orange = low item confidence), pick which editor player each row belongs to, then APPLY.');
                $s('scan-apply').disabled = false;
            } catch (err) {
                console.error(err);
                setScanStatus('⚠ ' + err.message);
            }
            $s('scan-go').disabled = false;
        }

        function autoWinner() {
            const ls = parseInt(SC.info.ls), rs = parseInt(SC.info.rs);
            if (isNaN(ls) || isNaN(rs) || ls === rs) { SC.info.win = 'none'; return; }
            const leftWins = ls > rs;
            SC.info.win = (leftWins === leftIsBlue()) ? 'blue' : 'red';
        }

        /* ---------- render results ---------- */
        function targetOptions(selected) {
            if (!matchData.teamdata) return '';
            let h = '';
            for (const [tk, label] of [['blueteam', 'BLUE'], ['redteam', 'RED']]) {
                (matchData.teamdata[tk].playerlist || []).forEach((p, i) => {
                    const v = `${tk}:${i}`;
                    h += `<option value="${v}" ${v === selected ? 'selected' : ''}>${label} ${i + 1} — ${esc(p.name || 'Player ' + (i + 1))}${p.hero ? ' (' + esc(p.hero) + ')' : ''}</option>`;
                });
            }
            return h;
        }
        function renderScan() {
            $s('scan-match').classList.add('show');
            $s('sm-ls').value = SC.info.ls; $s('sm-rs').value = SC.info.rs; $s('sm-dur').value = SC.info.dur; $s('sm-win').value = SC.info.win;
            const th = thr(), root = $s('scan-results'); root.innerHTML = '';
            for (const side of ['left', 'right']) {
                const col = document.createElement('div'); col.className = 'scan-col ' + side;
                col.innerHTML = `<h3>${side === 'left' ? 'LEFT' : 'RIGHT'} TEAM (${(side === 'left') === leftIsBlue() ? 'BLUE' : 'RED'})</h3>`;
                SC.rows.forEach((row, i) => {
                    if (row.side !== side) return;
                    const card = document.createElement('div'); card.className = 'scan-card';
                    card.innerHTML = `
                        <div class="scan-head">
                            <div class="portrait"></div>
                            <div class="nm">
                                <div style="font-size:.85rem;color:#aaa;margin-bottom:3px;">SCREENSHOT: ${esc(row.ocrName || 'NAME NOT READ')}</div>
                            </div>
                            <select data-assign data-i="${i}">${targetOptions(row.target)}</select>
                        </div>
                        <div class="scan-stats">
                            ${[['level', 'LVL'], ['k', 'K'], ['d', 'D'], ['a', 'A'], ['gold', 'GOLD']].map(([f, l]) =>
                                `<label>${l}<input type="number" data-i="${i}" data-f="${f}" value="${row[f]}"></label>`).join('')}
                        </div>
                        <div class="scan-items">
                            ${row.items.map((it, j) => {
                                const low = !it.empty && it.score < th;
                                return `<div class="scan-item ${low ? 'low' : ''} ${it.empty ? 'empty' : ''}">
                                    <img ${it.name === 'idle' ? 'style="visibility:hidden"' : `src="Assets/Itemandspell/${esc(it.name)}.png"`} onerror="this.style.visibility='hidden'">
                                    <input type="text" list="scan-items" data-i="${i}" data-slot="${j}" value="${esc(it.name)}">
                                    <small>${it.empty ? 'empty' : Math.round(it.score * 100) + '%'}</small>
                                </div>`;
                            }).join('')}
                        </div>`;
                    card.querySelector('.portrait').appendChild(row.portrait);
                    card.querySelector('.nm').appendChild(row.nameImg);
                    col.appendChild(card);
                });
                root.appendChild(col);
            }
        }
        $s('scan-results').addEventListener('input', e => {
            const t = e.target, row = SC.rows[+t.dataset.i]; if (!row) return;
            if (t.dataset.f) row[t.dataset.f] = t.value;
            else if (t.dataset.slot !== undefined) {
                const it = row.items[+t.dataset.slot], v = t.value.trim() || 'idle';
                it.name = v; it.empty = false; it.score = 1;
                const img = t.closest('.scan-item').querySelector('img');
                if (v === 'idle') img.style.visibility = 'hidden'; else { img.style.visibility = 'visible'; img.src = `Assets/Itemandspell/${v}.png`; }
            }
        });
        $s('scan-results').addEventListener('change', e => {
            if (e.target.dataset.assign !== undefined) SC.rows[+e.target.dataset.i].target = e.target.value;
        });

        /* ---------- apply into the editor ---------- */
        function applyScan() {
            if (!matchData.teamdata) { setScanStatus('⚠ Match data not loaded from the server yet.'); return; }
            const used = new Set();
            for (const r of SC.rows) {
                if (used.has(r.target)) { setScanStatus('⚠ Two scanned rows are assigned to the same player (' + r.target + '). Fix the dropdowns first.'); return; }
                used.add(r.target);
            }
            for (const r of SC.rows) {
                const [tk, ix] = r.target.split(':');
                const p = matchData.teamdata[tk].playerlist[+ix]; if (!p) continue;
                if (r.level !== '') p.level = +r.level;
                if (r.k !== '' && r.d !== '' && r.a !== '') p.KDA = `${r.k}/${r.d}/${r.a}`;
                if (r.gold !== '') p.gold = +r.gold;
                p.itemlist = r.items.map(i => i.name || 'idle');
            }
            const ls = parseInt(SC.info.ls), rs = parseInt(SC.info.rs), lb = leftIsBlue();
            if (!isNaN(ls)) matchData.teamdata[lb ? 'blueteam' : 'redteam'].score = ls;
            if (!isNaN(rs)) matchData.teamdata[lb ? 'redteam' : 'blueteam'].score = rs;
            if (/^\d\d:\d\d$/.test(SC.info.dur)) matchData.game_duration = SC.info.dur;
            matchData.winmatches = SC.info.win || 'none';
            calculateTotalGold('blueteam'); calculateTotalGold('redteam');
            renderAll();
            autoSave();
            setScanStatus('✔ Applied to the editor and saved.');
        }
    </script>
</body>
