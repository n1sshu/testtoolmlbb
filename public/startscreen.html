<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broadcast Overlay — Grand Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel-black:    #050608;
    --panel-black-2:  #0A0C11;
    --ink:            #FFFFFF;
    --ink-dim:        #A0AAB8;
    --blue:           #1FB8FF;
    --blue-dim:       rgba(31,184,255,0.35);
    --blue-glow:      rgba(31,184,255,0.6);
    --divider:        rgba(160,170,184,0.16);
  }

  @font-face {
    font-family: 'myfonts';
    src: url('Assets/Font/custom_font.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .display   { font-family: 'Bebas Neue', 'Impact', sans-serif; }
  .structural{ font-family: 'Oswald', sans-serif; }

  /* ============ WRAPPER / CANVAS ============ */
  .canvas{
    position: relative;
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }

  /* ============ FRAME ============ */
  .frame{
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: linear-gradient(180deg, var(--panel-black) 0%, var(--panel-black-2) 100%);
    border: 1px solid var(--blue-dim);
    box-shadow:
      0 0 0 1px rgba(31,184,255,0.08),
      0 0 40px rgba(31,184,255,0.10),
      inset 0 0 80px rgba(31,184,255,0.03);
    display: flex;
    flex-direction: column;
    animation: frameGlow 4.5s ease-in-out infinite;
  }

  @keyframes frameGlow{
    0%, 100%{ box-shadow: 0 0 0 1px rgba(31,184,255,0.08), 0 0 40px rgba(31,184,255,0.10), inset 0 0 80px rgba(31,184,255,0.03); }
    50%{      box-shadow: 0 0 0 1px rgba(31,184,255,0.16), 0 0 56px rgba(31,184,255,0.18), inset 0 0 80px rgba(31,184,255,0.05); }
  }

  /* ---- static corner grid-line accents (no motion) ---- */
  .corner-grid{
    position: absolute;
    width: 360px;
    height: 360px;
    pointer-events: none;
    z-index: 0;
    background-image:
      repeating-linear-gradient(60deg,  rgba(31,184,255,0.14) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(-60deg, rgba(31,184,255,0.09) 0 1px, transparent 1px 46px);
  }
  .corner-grid.tl{ top: 0; left: 0;
    -webkit-mask-image: radial-gradient(circle at top left, black 0%, transparent 68%);
    mask-image: radial-gradient(circle at top left, black 0%, transparent 68%);
  }
  .corner-grid.tr{ top: 0; right: 0;
    -webkit-mask-image: radial-gradient(circle at top right, black 0%, transparent 68%);
    mask-image: radial-gradient(circle at top right, black 0%, transparent 68%);
  }
  .corner-grid.bl{ bottom: 0; left: 0;
    -webkit-mask-image: radial-gradient(circle at bottom left, black 0%, transparent 68%);
    mask-image: radial-gradient(circle at bottom left, black 0%, transparent 68%);
  }
  .corner-grid.br{ bottom: 0; right: 0;
    -webkit-mask-image: radial-gradient(circle at bottom right, black 0%, transparent 68%);
    mask-image: radial-gradient(circle at bottom right, black 0%, transparent 68%);
  }

  .frame > .header,
  .frame > .title-row,
  .frame > .header-divider,
  .frame > .body-grid{
    position: relative;
    z-index: 1;
  }

  /* ============ HEADER ============ */
  .header{
    position: relative;
    display: flex;
    align-items: center;
    padding: 28px 48px 16px 48px;
    flex-shrink: 0;
  }

  .icon-expand{
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    opacity: 0.8;
  }
  .icon-expand svg{ width: 100%; height: 100%; stroke: var(--ink-dim); }

  /* ---- header logo (positioned independently) ---- */
  .header-logos{
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  /* ---- sponsor logo pinned to the far top-left corner of the whole frame ---- */
  .sponsor-logo{
    position: absolute;
    top: -15px;
    left: 45px;
    width: 220px;
    height: 220px;
    background-image: url('Assets/Other/eod_logo_nobg_white.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 3;
  }

  .league-logo{
    top:25px;
    width: 110px;
    height: 110px;
    background-image: url('Assets/Other/mlbb_logo_white.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

    .monarchylogo{
    top:25px;
    width: 75px;
    height: 75px;
    filter: brightness(0) invert(1);
    background-image: url('Assets/Other/monarchy_logo_nobg.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  .title-row{
    text-align: center;
    padding: 4px 0 20px 0;
    flex-shrink: 0;
  }
  .title-row h1{
    margin: 0;
    margin-right: -10px; /* cancels the trailing letter-spacing gap so it visually centers */
    font-family: 'Bebas Neue', sans-serif;
    font-size: 118px;
    line-height: 1;
    letter-spacing: 10px;
    color: var(--ink);
    text-shadow: 0 0 26px rgba(31,184,255,0.18);
  }

  .header-divider{
    height: 1px;
    margin: 0 44px;
    background: linear-gradient(90deg, transparent 0%, var(--blue-dim) 15%, var(--blue) 50%, var(--blue-dim) 85%, transparent 100%);
    opacity: 0.7;
    flex-shrink: 0;
  }

  /* ============ MAIN BODY GRID ============ */
  .body-grid{
    flex: 1;
    display: grid;
    grid-template-columns: 35% 65%;
    padding: 26px 44px 36px 44px;
    gap: 0;
    min-height: 0;
  }

  /* ---------- COLUMN 1 : MATCH INFO ---------- */
  .col-match{
    position: relative;
    display: flex;
    flex-direction: column;
    padding-right: 40px;
  }

  .col-label{
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 20px;
  }
  .col-label::before{
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--blue);
    border-radius: 50%;
    margin-right: 10px;
    box-shadow: 0 0 8px var(--blue-glow);
    vertical-align: middle;
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.35; }
  }

  .match-tag{
    font-family: 'myfonts', sans-serif;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: white;
    opacity: 0.85;
    margin-bottom: 10px;
  }

  /* --- versus module (shared by both matches) --- */
  .versus{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .team{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .team-logo{
    width: 74px;
    height: 74px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .team-logo::after{
    content:"";
    position:absolute; inset:-1px;
    border-radius:8px;
    filter: blur(3px);
    opacity: 0.6;
  }
  .team-logo .glyph{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--blue);
    letter-spacing: 1px;
    z-index: 1;
  }
  .team-name{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 2px;
    color: var(--blue);
    text-shadow: 0 0 14px rgba(31,184,255,0.4);
  }

  .vs-stack{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding-top: 6px;
  }
  .vs-stack .bo{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ink-dim);
  }
  .vs-stack .vs{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--ink);
  }

  /* --- versus module size variant for match 1 (slightly larger, the lead match) --- */
  .versus.lead{
    gap: 20px;
    margin-bottom: 8px;
  }
  .versus.lead .team-logo{ width: 88px; height: 88px; border-radius: 10px; }
  .versus.lead .team-logo::after{ border-radius: 10px; }
  .versus.lead .team-logo .glyph{ font-size: 28px; }
  .versus.lead .team-name{ font-size: 44px; letter-spacing: 3px; }
  .versus.lead .vs-stack .vs{ font-size: 28px; }
  .versus.lead .vs-stack .bo{ font-size: 14px; }

  /* --- time block (bare text, no boxed background) --- */
  .time-block{
    text-align: center;
    margin-bottom: 22px;
  }
  .timer-label{
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 55px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }
  .timer-value{
    font-family: 'myfonts', sans-serif;
    font-size: 148px;
    margin-top:60px;
    letter-spacing: 3px;
    line-height: 1;
    background: linear-gradient(180deg, #FFFFFF 0%, #C7CFDA 60%, #8B95A5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 22px rgba(31,184,255,0.25);
  }
  .time-block.lead .timer-value{ font-size: 78px; letter-spacing: 4px; }
  .time-block.lead .timer-label{ font-size: 12px; }

  .match-divider{
    height: 1px;
    background: var(--divider);
    margin: 4px 0 20px 0;
  }

  /* --- sponsor footer --- */
  .sponsor-footer{
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid var(--divider);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .sponsor-footer .tag{
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .sponsor-footer .opera-logo{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sponsor-footer .opera-logo .dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--blue);
    display: inline-block;
  }

  /* --- vertical divider between columns --- */
  .col-match::after{
    content:"";
    position: absolute;
    top: 4px;
    right: 0;
    bottom: 4px;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--blue-dim) 15%, var(--blue-dim) 85%, transparent);
  }

  /* ---------- COLUMN 2 : VIDEO CUTOUT ---------- */
  .col-video{
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 40px;
  }

  .video-frame{
    position: relative;
    width: 1152px;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    max-height: 100%;
    border-radius: 4px;
    background: transparent; /* pure passthrough for OBS camera layer beneath */
    border: 2px solid var(--blue-dim);
    box-shadow:
      0 0 0 1px rgba(31,184,255,0.06),
      0 0 30px rgba(31,184,255,0.14),
      inset 0 0 30px rgba(31,184,255,0.04);
    animation: videoGlow 4.5s ease-in-out infinite;
  }
  @keyframes videoGlow{
    0%,100%{ border-color: var(--blue-dim); }
    50%{ border-color: rgba(31,184,255,0.6); }
  }
</style>
</head>
<body>

<div class="canvas">
  <div class="frame">

    <div class="corner-grid tl"></div>
    <div class="corner-grid tr"></div>
    <div class="corner-grid bl"></div>
    <div class="corner-grid br"></div>

    <!-- HEADER -->
    <div class="header">
      <div class="header-logos">
        <div class="league-logo"></div>
      </div>
    </div>

    <!-- SPONSOR LOGO — pinned to the frame's top-left corner -->
    <div class="sponsor-logo"></div>

    <div class="title-row">
      <h1 class="display">GROUP STAGE</h1>
    </div>

    <div class="header-divider"></div>

    <!-- BODY -->
    <div class="body-grid">

      <!-- COLUMN 1 -->
      <div class="col-match">

        <div class="match-tag">MATCH 1</div>
        <div class="versus lead">
          <div class="team">
            <div class="team-logo"><span class="glyph">T1</span></div>
            <div class="team-name">T1</div>
          </div>

          <div class="vs-stack">
            <div class="bo structural">BO3</div>
            <div class="vs display">VS</div>
          </div>

          <div class="team">
            <div class="team-logo"><span class="glyph">BLG</span></div>
            <div class="team-name">BLG</div>
          </div>
        </div>

        <div class="time-block lead">
          <div class="timer-label"></div>
        </div>

        <div class="match-divider"></div>

        <div class="match-tag">MATCH 2</div>
        <div class="versus">
          <div class="team">
            <div class="team-logo"><span class="glyph">GEN</span></div>
            <div class="team-name">GEN</div>
          </div>

          <div class="vs-stack">
            <div class="bo structural">BO5</div>
            <div class="vs display">VS</div>
          </div>

          <div class="team">
            <div class="team-logo"><span class="glyph">JDG</span></div>
            <div class="team-name">JDG</div>
          </div>
        </div>

        <div class="time-block">
          <div class="timer-value">21:15</div>
        </div>

        <div class="sponsor-footer">
          <div class="monarchylogo"></div>
        </div>
      </div>

      <!-- COLUMN 2 -->
      <div class="col-video">
        <div class="video-frame"></div>
      </div>

    </div>

  </div>
</div>

<script>
(function () {
  let cachedTimer = null;

  const versusBlocks = document.querySelectorAll('.versus');
  const timerLabelEl  = document.querySelector('.time-block.lead .timer-label'); // Match 1
  const timerValueEl  = document.querySelector('.time-block:not(.lead) .timer-value'); // Match 2

  function setTeamLogo(logoBoxEl, imgSrc, fallbackText) {
    if (!logoBoxEl) return;
    let imgEl = logoBoxEl.querySelector('img.team-logo-img');
    const glyphEl = logoBoxEl.querySelector('.glyph');

    const hasRealLogo = imgSrc && imgSrc.length > 100; // filters out the transparent.png placeholder path

    if (hasRealLogo) {
      if (!imgEl) {
        imgEl = document.createElement('img');
        imgEl.className = 'team-logo-img';
        imgEl.style.width = '100%';
        imgEl.style.height = '100%';
        imgEl.style.objectFit = 'contain';
        imgEl.style.borderRadius = 'inherit';
        imgEl.style.position = 'relative';
        imgEl.style.zIndex = '1';
        logoBoxEl.appendChild(imgEl);
      }
      imgEl.src = imgSrc;
      imgEl.style.display = 'block';
      if (glyphEl) glyphEl.style.display = 'none';
    } else {
      if (imgEl) imgEl.style.display = 'none';
      if (glyphEl) {
        glyphEl.style.display = '';
        if (fallbackText) glyphEl.textContent = fallbackText;
      }
    }
  }

  function populateMatch(versusEl, data) {
    if (!versusEl || !data) return;
    const teams = versusEl.querySelectorAll('.team');

    if (teams[0]) {
      const logoBox = teams[0].querySelector('.team-logo');
      const nameEl = teams[0].querySelector('.team-name');
      if (data.team1) nameEl.textContent = data.team1;
      setTeamLogo(logoBox, data.logo1, data.team1);
    }
    if (teams[1]) {
      const logoBox = teams[1].querySelector('.team-logo');
      const nameEl = teams[1].querySelector('.team-name');
      if (data.team2) nameEl.textContent = data.team2;
      setTeamLogo(logoBox, data.logo2, data.team2);
    }

    const bo = versusEl.querySelector('.bo');
    if (bo && data.time) bo.textContent = data.time;
  }

  function formatTime(totalSec) {
    const hh = Math.floor(totalSec / 3600);
    const mm = Math.floor((totalSec % 3600) / 60);
    const ss = totalSec % 60;
    return hh > 0
      ? `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
      : `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }

  function tickCountdown() {
    if (!cachedTimer || !cachedTimer.seconds) return;
    const endTime = cachedTimer.startedAt + cachedTimer.seconds * 1000;
    const remainingMs = Math.max(0, endTime - Date.now());
    const totalSec = Math.floor(remainingMs / 1000);

    if (timerValueEl) timerValueEl.textContent = formatTime(totalSec);
    if (timerLabelEl) timerLabelEl.textContent = totalSec > 0 ? 'STARTS IN' : '';
  }

  async function refreshData() {
    try {
      const [scheduleRes, timerRes] = await Promise.all([
        fetch('/api/schedule'),
        fetch('/api/timer')
      ]);
      const schedule = await scheduleRes.json();
      cachedTimer = await timerRes.json();

      populateMatch(versusBlocks[0], schedule['1']);
      populateMatch(versusBlocks[1], schedule['2']);
    } catch (err) {
      console.error('Overlay data fetch failed:', err);
    }
  }

  refreshData();
  setInterval(refreshData, 5000);
  setInterval(tickCountdown, 1000);
})();
</script><script>

      if (imgEl) imgEl.style.display = 'none';
      if (glyphEl) {
        glyphEl.style.display = '';
        if (fallbackText) glyphEl.textContent = fallbackText;
      }
    }
  }

  function populateMatch(versusEl, data) {
    if (!versusEl || !data) return;
    const teams = versusEl.querySelectorAll('.team');

    if (teams[0]) {
      const logoBox = teams[0].querySelector('.team-logo');
      const nameEl = teams[0].querySelector('.team-name');
      if (data.team1) nameEl.textContent = data.team1;
      setTeamLogo(logoBox, data.logo1, data.team1);
    }
    if (teams[1]) {
      const logoBox = teams[1].querySelector('.team-logo');
      const nameEl = teams[1].querySelector('.team-name');
      if (data.team2) nameEl.textContent = data.team2;
      setTeamLogo(logoBox, data.logo2, data.team2);
    }

    const bo = versusEl.querySelector('.bo');
    if (bo && data.time) bo.textContent = data.time;
  }

  function formatTime(totalSec) {
    const hh = Math.floor(totalSec / 3600);
    const mm = Math.floor((totalSec % 3600) / 60);
    const ss = totalSec % 60;
    return hh > 0
      ? `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
      : `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }

  function tickCountdown() {
    if (!cachedTimer || !cachedTimer.seconds) return;
    const endTime = cachedTimer.startedAt + cachedTimer.seconds * 1000;
    const remainingMs = Math.max(0, endTime - Date.now());
    const totalSec = Math.floor(remainingMs / 1000);

    if (timerValueEl) timerValueEl.textContent = formatTime(totalSec);
    if (timerLabelEl) timerLabelEl.textContent = totalSec > 0 ? '' : '';
  }

  async function refreshData() {
    try {
      const [scheduleRes, timerRes] = await Promise.all([
        fetch('/api/schedule'),
        fetch('/api/timer')
      ]);
      const schedule = await scheduleRes.json();
      cachedTimer = await timerRes.json();

      populateMatch(versusBlocks[0], schedule['1']);
      populateMatch(versusBlocks[1], schedule['2']);
    } catch (err) {
      console.error('Overlay data fetch failed:', err);
    }
  }

  refreshData();
  setInterval(refreshData, 5000);
  setInterval(tickCountdown, 1000);
})();
</script>

</body>
</html>
